<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dark Sidebar Glass Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass-sidebar {
            background: rgba(16, 25, 34, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-active {
            background: rgba(19, 127, 236, 0.15);
            border: 1px solid rgba(19, 127, 236, 0.3);
        }
        .liquid-bg {
            background: radial-gradient(circle at top right, #137fec33, transparent),
                        radial-gradient(circle at bottom left, #137fec22, transparent);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden">
<!-- Main App Container (Simulated Background) -->
<div class="relative min-h-screen w-full flex liquid-bg">
<!-- Mock Content Behind Sidebar -->
<div class="flex-1 p-8 opacity-40">
<h1 class="text-4xl font-bold mb-6">Today's Workout</h1>
<div class="grid grid-cols-1 gap-4">
<div class="h-32 bg-white/5 rounded-xl border border-white/10"></div>
<div class="h-32 bg-white/5 rounded-xl border border-white/10"></div>
<div class="h-32 bg-white/5 rounded-xl border border-white/10"></div>
</div>
</div>
<!-- Dimming Overlay -->
<div class="absolute inset-0 z-40 bg-black/40 backdrop-blur-sm"></div>
<!-- Navigation Drawer (Glassmorphism Sidebar) -->
<div class="absolute left-0 top-0 z-50 h-full w-[85%] max-w-[320px] flex flex-col glass-sidebar shadow-2xl">
<!-- User Header Section -->
<div class="pt-12 px-6 pb-8">
<div class="flex items-center gap-4 mb-4">
<div class="relative">
<div class="size-14 rounded-full overflow-hidden border-2 border-primary/50 p-0.5">
<img alt="Gym avatar" class="w-full h-full object-cover rounded-full" data-alt="Close up portrait of a fit person smiling" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBMrdAzkxfV-bgq5LrjmRpo5MpCdByXmYMw5xfAFjH_GqxOUOKyt8_CDxGVi1Iak7E_TZ0j33L25X3dHVW15An2dssMaM9gBYSlxaIND9CZvUDhX3S0rX67blR_E-vlrc0BzjS_72Nb8sFVxhDtFuCjoxRUGeQ0oi8KYVtZxo2GaOgXKnRYd8ejYXMxQ7AeDYX9hQbzDsTzp_kFqaQpmtmlvMT3igFYX-wnDZwXSUzLp7uA7Gs4yTsdn_oVowAnvXaIkN6vK0xVquwi"/>
</div>
<div class="absolute bottom-0 right-0 size-4 bg-green-500 border-2 border-background-dark rounded-full"></div>
</div>
<div>
<h2 class="text-xl font-bold tracking-tight text-white">Alex Johnson</h2>
<p class="text-xs font-medium text-primary/80 uppercase tracking-widest">Elite Member</p>
</div>
</div>
</div>
<!-- Navigation List -->
<nav class="flex-1 px-3 space-y-1.5 overflow-y-auto">
<!-- Active Item -->
<div class="group relative flex h-12 items-center gap-4 rounded-xl px-4 glass-active cursor-pointer transition-all">
<div class="absolute left-0 h-6 w-1 bg-primary rounded-r-full"></div>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1">fitness_center</span>
<span class="text-white text-base font-semibold leading-tight tracking-wide">My Plans</span>
</div>
<!-- Regular Items -->
<div class="group flex h-12 items-center gap-4 rounded-xl px-4 hover:bg-white/5 cursor-pointer transition-all">
<span class="material-symbols-outlined text-white/60 group-hover:text-white transition-colors">history</span>
<span class="text-white/70 text-base font-medium leading-tight group-hover:text-white transition-colors">Workout History</span>
</div>
<div class="group flex h-12 items-center gap-4 rounded-xl px-4 hover:bg-white/5 cursor-pointer transition-all">
<span class="material-symbols-outlined text-white/60 group-hover:text-white transition-colors">leaderboard</span>
<span class="text-white/70 text-base font-medium leading-tight group-hover:text-white transition-colors">Progress Stats</span>
</div>
<div class="group flex h-12 items-center gap-4 rounded-xl px-4 hover:bg-white/5 cursor-pointer transition-all">
<span class="material-symbols-outlined text-white/60 group-hover:text-white transition-colors">location_on</span>
<span class="text-white/70 text-base font-medium leading-tight group-hover:text-white transition-colors">Gym Location</span>
</div>
<div class="group flex h-12 items-center gap-4 rounded-xl px-4 hover:bg-white/5 cursor-pointer transition-all">
<span class="material-symbols-outlined text-white/60 group-hover:text-white transition-colors">nutrition</span>
<span class="text-white/70 text-base font-medium leading-tight group-hover:text-white transition-colors">Nutrition Log</span>
</div>
<div class="my-4 mx-4 border-t border-white/10"></div>
<div class="group flex h-12 items-center gap-4 rounded-xl px-4 hover:bg-white/5 cursor-pointer transition-all">
<span class="material-symbols-outlined text-white/60 group-hover:text-white transition-colors">settings</span>
<span class="text-white/70 text-base font-medium leading-tight group-hover:text-white transition-colors">Settings</span>
</div>
</nav>
<!-- Footer Section -->
<div class="p-6 space-y-4">
<!-- Logout Button -->
<div class="flex items-center gap-4 bg-white/5 hover:bg-red-500/10 rounded-xl px-4 h-14 cursor-pointer group transition-all border border-white/10 hover:border-red-500/20">
<div class="flex items-center justify-center rounded-lg bg-white/5 group-hover:bg-red-500/20 shrink-0 size-10 transition-colors">
<span class="material-symbols-outlined text-white/60 group-hover:text-red-500">logout</span>
</div>
<span class="text-white/70 text-base font-medium group-hover:text-red-500 transition-colors">Logout</span>
</div>
<!-- Meta Info -->
<div class="flex flex-col gap-1 px-1">
<div class="flex items-center justify-between">
<p class="text-white/30 text-xs font-normal">v2.4.0 (Gold)</p>
<div class="flex items-center gap-1.5">
<div class="size-2 rounded-full bg-primary/40 animate-pulse"></div>
<span class="text-primary/60 text-[10px] font-bold tracking-widest uppercase">Syncing</span>
</div>
</div>
</div>
</div>
<!-- Safe Area Bottom (iOS) -->
<div class="h-8 bg-transparent"></div>
</div>
<!-- Sidebar Close Handle (Visual indicator) -->
<div class="absolute left-[320px] top-1/2 -translate-y-1/2 z-50 ml-2">
<div class="w-1.5 h-12 bg-white/20 rounded-full"></div>
</div>
</div>
</body></html>
