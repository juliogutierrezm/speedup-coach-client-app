<div class="callback-container">
  <div class="callback-card">
    <div class="callback-content" *ngIf="!error; else errorBlock">
      <div class="app-spinner" aria-hidden="true"></div>
      <h2>Completando autenticación...</h2>
      <p>Por favor espera mientras procesamos tu información.</p>
    </div>
    <ng-template #errorBlock>
      <div class="error-content">
        <p class="error-label">Error de autenticación</p>
        <p class="error-message">{{ error }}</p>
        <button type="button" (click)="retryLogin()">Intentar de nuevo</button>
      </div>
    </ng-template>
  </div>
</div>
