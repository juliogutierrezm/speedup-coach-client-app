<div class="auth-container">
  <div class="auth-card">
    <h2>Recupera tu contraseña</h2>
    <p class="subtitle">Te enviaremos un código a tu correo para restablecerla.</p>

    <form *ngIf="step === 'request'" class="form" [formGroup]="requestForm" (ngSubmit)="sendCode()">
      <label class="field">
        <span>Correo electrónico</span>
        <input type="email" formControlName="email" placeholder="tu@correo.com" />
        <small class="error" *ngIf="requestForm.controls.email.touched && requestForm.controls.email.invalid">
          Ingresa un correo válido.
        </small>
      </label>

      <button class="primary" type="submit" [disabled]="loading">
        <span *ngIf="!loading">Enviar código</span>
        <span *ngIf="loading">Enviando...</span>
      </button>
    </form>

    <form *ngIf="step === 'confirm'" class="form" [formGroup]="confirmForm" (ngSubmit)="confirmReset()">
      <label class="field">
        <span>Código de verificación</span>
        <input type="text" formControlName="code" placeholder="123456" />
        <small class="error" *ngIf="confirmForm.controls.code.touched && confirmForm.controls.code.invalid">
          Ingresa el código enviado a tu correo.
        </small>
      </label>

      <label class="field">
        <span>Nueva contraseña</span>
        <input type="password" formControlName="newPassword" placeholder="••••••••" />
        <small class="hint">Mínimo 8 caracteres, 1 mayúscula, 1 minúscula y 1 número.</small>
        <small class="error" *ngIf="confirmForm.controls.newPassword.touched && confirmForm.controls.newPassword.hasError('minlength')">
          Debe tener al menos 8 caracteres.
        </small>
        <small class="error" *ngIf="confirmForm.controls.newPassword.touched && confirmForm.controls.newPassword.hasError('policy')">
          Debe incluir mayúsculas, minúsculas y números.
        </small>
      </label>

      <label class="field">
        <span>Confirmar contraseña</span>
        <input type="password" formControlName="confirmPassword" placeholder="••••••••" />
        <small class="error" *ngIf="showMismatch">Las contraseñas no coinciden.</small>
      </label>

      <button class="primary" type="submit" [disabled]="loading">
        <span *ngIf="!loading">Actualizar contraseña</span>
        <span *ngIf="loading">Actualizando...</span>
      </button>
    </form>

    <button class="link" type="button" (click)="goToLogin()" [disabled]="loading">Volver al login</button>

    <div class="error-banner" *ngIf="error">{{ error }}</div>
    <div class="success-banner" *ngIf="success">{{ success }}</div>
  </div>
</div>
