<div class="auth-page">
  <div class="auth-container">
    <!-- Card -->
    <div class="auth-card">
      <!-- Logo Section (integrated) -->
      <div class="auth-logo">
        <img src="assets/SpeedUpCoachLogoPNG.png" alt="SpeedUp Coach" />
      </div>

      <div class="auth-header">
        <h1>Bienvenido</h1>
        <p>Inicia sesión en tu cuenta de entrenamiento</p>
      </div>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Email Field -->
        <div class="form-field">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input 
              id="email"
              type="email" 
              formControlName="email" 
              placeholder="tu@correo.com"
              autocomplete="email"
            />
          </div>
          <span class="field-error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
            Ingresa un correo válido.
          </span>
        </div>

        <!-- Password Field -->
        <div class="form-field">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input 
              id="password"
              [type]="showPassword ? 'text' : 'password'" 
              formControlName="password" 
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button 
              type="button" 
              class="toggle-password" 
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <!-- Eye Open -->
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye Closed -->
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span class="field-error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
            La contraseña es obligatoria.
          </span>
        </div>

        <!-- Submit Button -->
        <button class="btn-primary" type="submit" [disabled]="loading">
          <span *ngIf="!loading">Iniciar sesión</span>
          <span *ngIf="loading" class="btn-loading">
            <svg class="spinner" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="60" stroke-linecap="round"/>
            </svg>
            Iniciando...
          </span>
        </button>

        <!-- Forgot Password Link -->
        <button class="btn-link" type="button" (click)="goToForgotPassword()" [disabled]="loading">
          ¿Olvidaste tu contraseña?
        </button>

        <!-- Error Banner -->
        <div class="error-banner" *ngIf="error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ error }}
        </div>
      </form>
    </div>

    <!-- Footer -->
    <p class="auth-footer">© 2026 SpeedUp Coach. Todos los derechos reservados.</p>
  </div>
</div>
