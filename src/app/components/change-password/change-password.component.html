<div class="auth-container">
  <div class="auth-card">
    <h2>Cambia tu contraseña</h2>
    <p class="subtitle">Tu cuenta requiere una nueva contraseña para continuar.</p>

    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label class="field">
        <span>Nueva contraseña</span>
        <input type="password" formControlName="newPassword" placeholder="••••••••" />
        <small class="hint">Mínimo 8 caracteres, 1 mayúscula, 1 minúscula y 1 número.</small>
        <small class="error" *ngIf="form.controls.newPassword.touched && form.controls.newPassword.hasError('minlength')">
          Debe tener al menos 8 caracteres.
        </small>
        <small class="error" *ngIf="form.controls.newPassword.touched && form.controls.newPassword.hasError('policy')">
          Debe incluir mayúsculas, minúsculas y números.
        </small>
      </label>

      <label class="field">
        <span>Confirmar contraseña</span>
        <input type="password" formControlName="confirmPassword" placeholder="••••••••" />
        <small class="error" *ngIf="showMismatch">Las contraseñas no coinciden.</small>
      </label>

      <button class="primary" type="submit" [disabled]="loading">
        <span *ngIf="!loading">Guardar y continuar</span>
        <span *ngIf="loading">Guardando...</span>
      </button>

      <button class="link" type="button" (click)="backToLogin()" [disabled]="loading">Volver al login</button>

      <div class="error-banner" *ngIf="error">{{ error }}</div>
    </form>
  </div>
</div>
