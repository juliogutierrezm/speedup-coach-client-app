<section class="profile-page">
  <header class="profile-header">
    <div class="profile-header-copy">
      <div class="profile-header-top">
      <p class="profile-eyebrow">Mi cuenta</p>
      <div *ngIf="profile" class="profile-avatar">
        {{ getInitials(profile.givenName + ' ' + profile.familyName) }}
      </div>
      </div>
      <h1 class="profile-title">Información personal y estado físico.</h1>
    </div>

  </header>

  <div *ngIf="errorMessage" class="profile-error" role="alert">
    {{ errorMessage }}
  </div>

  <div *ngIf="isLoading" class="profile-loading" role="status">
    <div class="profile-spinner" aria-hidden="true"></div>
    <p class="profile-loading-text">CARGANDO PERFIL...</p>
  </div>

  <section *ngIf="!isLoading && !errorMessage && profile" class="profile-content">
    <article class="profile-card">
      <h2 class="profile-card-title">
        <span class="material-symbols-outlined profile-card-icon">person</span>
        Información Personal
      </h2>

      <div class="profile-grid">
        <div class="profile-field">
          <label class="profile-label">Nombre</label>
          <input
            readonly
            [value]="profile.givenName"
            class="profile-input"
          />
        </div>

        <div class="profile-field">
          <label class="profile-label">Apellido</label>
          <input
            readonly
            [value]="profile.familyName"
            class="profile-input"
          />
        </div>

        <div class="profile-field">
          <label class="profile-label">Email</label>
          <input
            readonly
            [value]="profile.email"
            class="profile-input"
          />
        </div>

        <div class="profile-field">
          <label class="profile-label">Teléfono</label>
          <input
            readonly
            [value]="profile.telephone"
            class="profile-input"
          />
        </div>

        <div class="profile-field">
          <label class="profile-label">Edad</label>
          <input
            readonly
            [value]="getAge(profile.dateOfBirth)"
            class="profile-input"
          />
        </div>

        <div class="profile-field">
          <label class="profile-label">Género</label>
          <input
            readonly
            [value]="profile.gender"
            class="profile-input"
          />
        </div>

        <div class="profile-field profile-field--wide">
          <label class="profile-label">Entrenador</label>
          <input
            readonly
            [value]="profile.trainerName || 'No asignado'"
            class="profile-input"
          />
        </div>

        <div class="profile-field profile-field--wide">
          <label class="profile-label">Notas</label>
          <textarea
            readonly
            rows="3"
            class="profile-textarea"
          >{{ profile.notes }}</textarea>
        </div>
      </div>
    </article>

    <article class="profile-card">
      <h2 class="profile-card-title">
        <span class="material-symbols-outlined profile-card-icon">medical_services</span>
        Estado Físico
      </h2>

      <div class="profile-field">
        <label class="profile-label">Lesiones o condiciones</label>
        <textarea
          readonly
          rows="3"
          class="profile-textarea"
        >{{ formatInjuries(profile.injuries) }}</textarea>
        <p class="profile-helper">
          * Para actualizar esta información, contacta a tu entrenador directamente.
        </p>
      </div>
    </article>
  </section>
</section>
