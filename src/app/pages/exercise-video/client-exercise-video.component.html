<div class="exercise-video-page">
  <header class="video-header">
    <button class="nav-back" type="button" (click)="goBack()" aria-label="Volver al ejercicio" [disabled]="isLoading">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"><path fill="currentColor" d="M11.354 6.646a.5.5 0 0 1 0 .708L7.207 11.5H18a.5.5 0 0 1 0 1H7.207l4.147 4.146a.5.5 0 0 1-.708.708l-5-5a.5.5 0 0 1 0-.708l5-5a.5.5 0 0 1 .708 0"/></svg>
    </button>
    <div class="video-header-text">
      <p class="video-eyebrow">{{ exerciseTitle }}</p>
      <h1 class="video-title">{{ planTitle }} / {{ sessionTitle }}</h1>
    </div>
  </header>

  <div class="video-error" *ngIf="errorMessage" role="status" aria-live="polite">
    {{ errorMessage }}
  </div>

  <div
    class="video-loading"
    *ngIf="isLoading"
    role="status"
    aria-live="polite"
    [attr.aria-busy]="isLoading">
    <div class="app-spinner" aria-hidden="true"></div>
    <p>Cargando video...</p>
  </div>

  <section class="video-frame" *ngIf="!isLoading && !videoMissing && !errorMessage">
    <video
      *ngIf="videoUrl; else youtubeFallback"
      controls
      preload="metadata"
      playsinline
      [attr.poster]="videoPoster || ''"
      [attr.title]="exerciseTitle"
      (error)="onNativeVideoError()">
      <source [src]="videoUrl" type="video/mp4" />
      Tu navegador no soporta reproducir video.
    </video>

    <ng-template #youtubeFallback>
      <ng-container *ngIf="youtubeEmbedUrl; else videoPlaceholder">
        <iframe
          *ngIf="isYouTubePlayerVisible; else youtubePoster"
          [src]="youtubeEmbedUrl"
          [attr.title]="'Video de ' + exerciseTitle"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

        <ng-template #youtubePoster>
          <button
            class="video-launch"
            type="button"
            (click)="playYouTubeVideo()"
            [attr.aria-label]="'Reproducir video de ' + exerciseTitle">
            <img
              *ngIf="videoPoster; else fallbackPoster"
              class="video-launch-poster"
              [src]="videoPoster || ''"
              [alt]="exerciseTitle" />

            <ng-template #fallbackPoster>
              <div class="video-placeholder">
                <p>Video disponible</p>
              </div>
            </ng-template>

            <span class="video-launch-overlay">
              <span class="video-launch-icon" aria-hidden="true">▶</span>
              <span class="video-launch-text">Ver video</span>
            </span>
          </button>
        </ng-template>
      </ng-container>

      <ng-template #videoPlaceholder>
        <div class="video-placeholder">
          <p>No hay video disponible para este ejercicio.</p>
        </div>
      </ng-template>
    </ng-template>
  </section>

  <div class="video-missing" *ngIf="!isLoading && videoMissing && !errorMessage">
    <p>No encontramos un video para este ejercicio.</p>
    <button class="client-button" type="button" (click)="goBack()">Volver</button>
  </div>
</div>
